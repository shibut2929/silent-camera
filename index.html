<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>しずかカメラ</title>
<meta name="description" content="シャッター音を鳴らさずに写真を撮るWebアプリ">
<meta name="theme-color" content="#0c0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しずかカメラ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* 全画面カメラ。映像を主役に、操作は親指が届く下端へ集める */
:root{
  --ground:#0c0f12; --panel:#171c21; --line:#2b333b;
  --ink:#f2f5f7; --muted:#9aa6b1; --accent:#7fd1c7; --danger:#ff8a7a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);overflow:hidden;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.quiet{display:flex;align-items:center;gap:7px;color:var(--accent);font-weight:600}
.quiet i{width:7px;height:7px;border-radius:50%;background:var(--accent)}

.stage{position:relative;min-height:0;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
video.mirror{transform:scaleX(-1)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:blink .16s ease-out}
@keyframes blink{0%{opacity:.75}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.on{animation:none}}

.notice{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));
  text-align:center;background:var(--ground)}
.notice p{margin:0;max-width:30em;color:var(--muted)}
.notice strong{color:var(--ink);font-size:17px}

.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:18px max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(22px,env(safe-area-inset-left,0px))}
.thumb{justify-self:start;position:relative;width:54px;height:54px;border-radius:8px;overflow:hidden;
  background:var(--panel);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb b{position:absolute;right:3px;bottom:2px;font-size:11px;font-weight:700;padding:0 5px;border-radius:9px;
  background:rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--ink);padding:4px;display:block}
.shutter::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:var(--ink);transition:transform .08s}
.shutter:active::after{transform:scale(.86)}
.shutter:disabled{opacity:.35}
.flip{justify-self:end;width:54px;height:54px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center}
.flip svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;inset:0;background:var(--ground);display:flex;flex-direction:column;z-index:5}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line)}
.head h1{font-size:16px;margin:0;font-variant-numeric:tabular-nums}
.link{color:var(--accent);font-weight:600;min-height:44px;padding:0 4px}
.grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;align-content:start;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:3px;padding:3px max(3px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 3px) max(3px,env(safe-area-inset-left,0px))}
.cell{position:relative;aspect-ratio:1;max-width:100%;background:var(--panel);overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .ok{position:absolute;right:4px;bottom:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#0c0f12;
  font-size:12px;font-weight:800;line-height:18px;text-align:center}
.empty{flex:1;display:grid;place-items:center;padding:24px;color:var(--muted);text-align:center}
.large{flex:1;min-height:0;display:grid;place-items:center;background:#000}
.large img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;min-height:0;-webkit-touch-callout:default}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.btn{min-height:48px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.btn.main{background:var(--accent);border-color:var(--accent);color:#0c0f12}
.btn.warn{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);transform:translateX(-50%);z-index:9;
  max-width:calc(100vw - 32px);width:max-content;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;text-align:center}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <span class="quiet"><i></i>無音</span>
    <span id="size">カメラ準備中</span>
  </div>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="flash" class="flash"></div>
    <div id="notice" class="notice" hidden>
      <strong id="noticeTitle"></strong>
      <p id="noticeBody"></p>
      <button id="retry" class="btn main" style="padding:0 24px">もう一度試す</button>
    </div>
  </div>
  <div class="bar">
    <button id="openGallery" class="thumb" aria-label="撮った写真を見る"><img id="lastThumb" alt="" hidden><b id="count" hidden></b></button>
    <button id="shutter" class="shutter" aria-label="撮影" disabled></button>
    <button id="flip" class="flip" aria-label="前後のカメラを切り替える" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></svg>
    </button>
  </div>
</main>

<section id="gallery" class="sheet" hidden>
  <div class="head">
    <button id="closeGallery" class="link">カメラに戻る</button>
    <h1 id="galleryTitle">0枚</h1>
    <button id="saveAll" class="link">すべて保存</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>まだ写真がありません</div>
</section>

<section id="viewer" class="sheet" hidden>
  <div class="head">
    <button id="closeViewer" class="link">一覧に戻る</button>
    <h1 id="viewerTitle"></h1>
    <span style="width:80px"></span>
  </div>
  <div class="large"><img id="viewerImage" alt="撮影した写真"></div>
  <div class="actions">
    <button id="remove" class="btn warn">削除</button>
    <button id="saveOne" class="btn main">写真に保存</button>
  </div>
</section>

<div id="toast" class="toast" role="status" hidden></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const video = $('video');
const JPEG_QUALITY = 0.95;
const THUMB_EDGE = 320;

let stream = null;
let facing = 'environment';
let photos = [];          // 新しい順
let current = null;       // 拡大表示中の写真
let currentUrl = null;
let db = null;
let starting = false;
const thumbUrls = new Map();

/* ---------- 保存先(端末内のIndexedDB) ---------- */
function openDb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('shizuka-camera', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('photos', {keyPath:'id'});
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function tx(mode, work){
  return new Promise((resolve, reject) => {
    const t = db.transaction('photos', mode);
    const out = work(t.objectStore('photos'));
    t.oncomplete = () => resolve(out && out.result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const putPhoto = p => db ? tx('readwrite', s => s.put(p)) : Promise.resolve();
const deletePhoto = id => db ? tx('readwrite', s => s.delete(id)) : Promise.resolve();
const loadPhotos = () => db ? tx('readonly', s => s.getAll()) : Promise.resolve([]);

/* ---------- カメラ ---------- */
function stopCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  $('shutter').disabled = true;
}
function showNotice(title, body){
  $('noticeTitle').textContent = title;
  $('noticeBody').textContent = body;
  $('notice').hidden = false;
}
async function startCamera(){
  if (starting) return;
  starting = true;
  stopCamera();
  $('notice').hidden = true;
  $('size').textContent = 'カメラ準備中';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showNotice('カメラを使えません', 'https:// で始まるアドレスをSafariかChromeで開いてください。');
      return;
    }
    // 音声は要求しない。写真用の処理も使わず、動画の1コマだけを保存する
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:facing}, width:{ideal:4032}, height:{ideal:3024}}
    });
    video.srcObject = stream;
    video.classList.toggle('mirror', facing === 'user');
    await video.play().catch(() => {});
    await waitForFrame();
    $('size').textContent = video.videoWidth + ' × ' + video.videoHeight;
    $('shutter').disabled = false;
    const devices = await navigator.mediaDevices.enumerateDevices();
    $('flip').hidden = devices.filter(d => d.kind === 'videoinput').length < 2;
  } catch (e) {
    stopCamera();
    $('size').textContent = '停止中';
    if (e.name === 'NotAllowedError') {
      showNotice('カメラが許可されていません', 'iPhoneの設定アプリでSafariのカメラを「確認」か「許可」にして、もう一度試してください。');
    } else if (e.name === 'NotFoundError') {
      showNotice('カメラが見つかりません', 'この端末では使えるカメラを検出できませんでした。');
    } else if (e.name === 'NotReadableError') {
      showNotice('カメラを開けません', '別のアプリがカメラを使っている可能性があります。閉じてから試してください。');
    } else {
      showNotice('カメラを開けません', e.message || 'ページを開き直してください。');
    }
  } finally {
    starting = false;
  }
}
function waitForFrame(){
  if (video.videoWidth) return Promise.resolve();
  return new Promise(resolve => {
    const done = () => { video.removeEventListener('loadedmetadata', done); resolve(); };
    video.addEventListener('loadedmetadata', done);
    setTimeout(done, 4000);
  });
}

/* ---------- 撮影 ---------- */
function drawFrame(width, height, source){
  const c = document.createElement('canvas');
  c.width = width; c.height = height;
  const g = c.getContext('2d');
  if (facing === 'user') { g.translate(width, 0); g.scale(-1, 1); }
  g.drawImage(source, 0, 0, width, height);
  return c;
}
const toJpeg = (canvas, q) => new Promise((resolve, reject) =>
  canvas.toBlob(b => b ? resolve(b) : reject(new Error('画像を作れませんでした')), 'image/jpeg', q));

function flash(){
  const f = $('flash');
  f.classList.remove('on');
  void f.offsetWidth;
  f.classList.add('on');
}
async function shoot(){
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return;
  const scale = THUMB_EDGE / Math.max(w, h);
  // 押した瞬間のコマを同期で確保し、変換は後から行う(連写で取りこぼさないため)
  const full = drawFrame(w, h, video);
  flash();
  const time = Date.now();
  const thumbCanvas = document.createElement('canvas');
  thumbCanvas.width = Math.round(w * scale);
  thumbCanvas.height = Math.round(h * scale);
  thumbCanvas.getContext('2d').drawImage(full, 0, 0, thumbCanvas.width, thumbCanvas.height);
  try {
    const [blob, thumb] = await Promise.all([toJpeg(full, JPEG_QUALITY), toJpeg(thumbCanvas, 0.7)]);
    const photo = {id: time + '-' + Math.random().toString(36).slice(2,7), time, width:w, height:h, blob, thumb, saved:false};
    photos.unshift(photo);
    photos.sort((a,b) => b.time - a.time);
    refresh();
    await putPhoto(photo);
  } catch (e) {
    toast('保存に失敗しました: ' + e.message);
  }
}

/* ---------- 画面の更新 ---------- */
function thumbUrl(p){
  if (!thumbUrls.has(p.id)) thumbUrls.set(p.id, URL.createObjectURL(p.thumb));
  return thumbUrls.get(p.id);
}
function refresh(){
  const n = photos.length;
  const img = $('lastThumb'), badge = $('count');
  img.hidden = badge.hidden = n === 0;
  if (n) { img.src = thumbUrl(photos[0]); badge.textContent = n; }
  $('galleryTitle').textContent = n + '枚';
  $('saveAll').hidden = n === 0;
  $('empty').hidden = n !== 0;
  $('grid').hidden = n === 0;
  if (!$('gallery').hidden) renderGrid();
}
function renderGrid(){
  const grid = $('grid');
  grid.replaceChildren(...photos.map(p => {
    const b = document.createElement('button');
    b.className = 'cell';
    b.setAttribute('aria-label', stamp(p.time) + ' の写真を開く');
    const i = document.createElement('img');
    i.src = thumbUrl(p); i.alt = ''; i.loading = 'lazy';
    b.append(i);
    if (p.saved) {
      const s = document.createElement('span');
      s.className = 'ok'; s.textContent = '✓';
      b.append(s);
    }
    b.addEventListener('click', () => openViewer(p));
    return b;
  }));
}
function stamp(t){
  const d = new Date(t);
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '/' + p(d.getMonth()+1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fileName(p){
  const d = new Date(p.time);
  const n = (v, l=2) => String(v).padStart(l,'0');
  return 'IMG_' + d.getFullYear() + n(d.getMonth()+1) + n(d.getDate()) + '_' + n(d.getHours()) + n(d.getMinutes()) + n(d.getSeconds()) + '_' + n(d.getMilliseconds(),3) + '.jpg';
}
function openViewer(p){
  current = p;
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(p.blob);
  $('viewerImage').src = currentUrl;
  $('viewerTitle').textContent = stamp(p.time);
  armRemove(false);
  $('viewer').hidden = false;
}
function closeViewer(){
  $('viewer').hidden = true;
  $('viewerImage').removeAttribute('src');
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = null;
  current = null;
}
let toastTimer = 0;
function toast(text){
  const t = $('toast');
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------- 写真アプリへ保存(共有シート) ---------- */
async function savePhotos(list){
  if (!list.length) return;
  const files = list.map(p => new File([p.blob], fileName(p), {type:'image/jpeg', lastModified:p.time}));
  if (navigator.canShare && navigator.canShare({files})) {
    try {
      await navigator.share({files});
    } catch (e) {
      if (e.name === 'AbortError') return;
      toast('共有シートを開けませんでした');
      return;
    }
  } else {
    // PCなど共有シートがない環境ではダウンロードする
    for (const file of files) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
  }
  for (const p of list) { p.saved = true; await putPhoto(p); }
  refresh();
  toast('保存の操作が終わった写真に ✓ を付けました');
}

/* ---------- 削除は2回押しで確定 ---------- */
let removeArmed = false, removeTimer = 0;
function armRemove(on){
  removeArmed = on;
  clearTimeout(removeTimer);
  $('remove').textContent = on ? 'もう一度押して削除' : '削除';
  if (on) removeTimer = setTimeout(() => armRemove(false), 3000);
}
async function removeCurrent(){
  if (!current) return;
  if (!removeArmed) { armRemove(true); return; }
  const p = current;
  armRemove(false);
  try {
    await deletePhoto(p.id);   // 端末から消えたのを確認してから画面を更新する
  } catch (e) {
    toast('削除できませんでした。もう一度試してください');
    return;
  }
  photos = photos.filter(x => x.id !== p.id);
  const u = thumbUrls.get(p.id);
  if (u) { URL.revokeObjectURL(u); thumbUrls.delete(p.id); }
  closeViewer();
  refresh();
}

/* ---------- 操作 ---------- */
$('shutter').addEventListener('click', shoot);
$('flip').addEventListener('click', () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); });
$('retry').addEventListener('click', startCamera);
$('openGallery').addEventListener('click', () => { renderGrid(); refresh(); $('gallery').hidden = false; });
$('closeGallery').addEventListener('click', () => { $('gallery').hidden = true; });
$('closeViewer').addEventListener('click', closeViewer);
$('saveOne').addEventListener('click', () => current && savePhotos([current]));
$('saveAll').addEventListener('click', () => savePhotos(photos.filter(p => !p.saved).length ? photos.filter(p => !p.saved) : photos));
$('remove').addEventListener('click', removeCurrent);

// アプリを離れたらカメラを止め、戻ったら再開する
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (!stream) startCamera();
});

/* ---------- 起動 ---------- */
(async () => {
  refresh();
  try {
    db = await openDb();
    photos = (await loadPhotos()).sort((a,b) => b.time - a.time);
    refresh();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    toast('この環境では写真を保持できません。撮ったらすぐ保存してください');
  }
  startCamera();
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
